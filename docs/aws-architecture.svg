<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820">
<defs>
  <!-- solid arrowhead -->
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#555555"/>
  </marker>
  <!-- dashed arrowhead -->
  <marker id="arrd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#aaaaaa"/>
  </marker>
</defs>

<!-- white background -->
<rect width="960" height="820" fill="#ffffff"/>

<!-- ── AWS Account boundary ───────────────────────────────────────────── -->
<rect x="30" y="30" width="740" height="660" rx="12" fill="#fffbf5" stroke="#CD7B2E" stroke-width="1.5" />
<text x="50" y="58" font-size="12" font-weight="700" fill="#CD7B2E" font-family="'Amazon Ember',system-ui,sans-serif">Customer AWS Account</text>

<!-- ── EventBridge ────────────────────────────────────────────────────── -->
<rect x="376" y="86" width="48" height="48" rx="10" fill="#C7166B" stroke="none" stroke-width="1.5" />
<text x="400" y="150" font-size="10" font-weight="600" fill="#1a1a2e" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >EventBridge Scheduler</text>
<text x="400" y="164" font-size="9" font-weight="normal" fill="#888888" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >every 5 min</text>

<!-- EventBridge → Lambda -->
<line x1="400" y1="138" x2="400" y2="218" stroke="#555555" stroke-width="1.8"  marker-end="url(#arr)"/>

<!-- ── Lambda ─────────────────────────────────────────────────────────── -->
<rect x="372" y="212" width="56" height="56" rx="10" fill="#FF9900" stroke="none" stroke-width="1.5" />
<text x="400" y="284" font-size="10" font-weight="600" fill="#1a1a2e" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >Lambda</text>
<text x="400" y="312" font-size="9" font-weight="normal" fill="#888888" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >runtime/aws  +  plugins/sre</text>

<!-- ── Data sources (left) ────────────────────────────────────────────── -->
<text x="145" y="218" font-size="9" font-weight="600" fill="#888888" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >reads own account</text>

<rect x="69" y="249" width="42" height="42" rx="10" fill="#C7166B" stroke="none" stroke-width="1.5" />
<text x="90" y="307" font-size="10" font-weight="600" fill="#1a1a2e" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >CloudWatch</text>
<rect x="164" y="249" width="42" height="42" rx="10" fill="#C7166B" stroke="none" stroke-width="1.5" />
<text x="185" y="307" font-size="10" font-weight="600" fill="#1a1a2e" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >CloudTrail</text>
<rect x="262" y="249" width="42" height="42" rx="10" fill="#FF9900" stroke="none" stroke-width="1.5" />
<text x="283" y="307" font-size="10" font-weight="600" fill="#1a1a2e" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >EC2 / ECS / EKS</text>

<!-- Lambda → data sources -->
<line x1="372" y1="248" x2="116" y2="252" stroke="#555555" stroke-width="1.8"  marker-end="url(#arr)"/>
<line x1="372" y1="250" x2="198" y2="253" stroke="#555555" stroke-width="1.8"  marker-end="url(#arr)"/>
<line x1="372" y1="252" x2="303" y2="254" stroke="#555555" stroke-width="1.8"  marker-end="url(#arr)"/>

<!-- ── DynamoDB (right) ───────────────────────────────────────────────── -->
<rect x="566" y="206" width="48" height="48" rx="10" fill="#3F48CC" stroke="none" stroke-width="1.5" />
<text x="590" y="270" font-size="10" font-weight="600" fill="#1a1a2e" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >DynamoDB</text>
<text x="590" y="284" font-size="9" font-weight="normal" fill="#888888" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >alert suppression</text>

<!-- Lambda ↔ DynamoDB -->
<line x1="428" y1="238" x2="562" y2="222" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)" marker-start="url(#arr)"/>

<!-- ── SNS ────────────────────────────────────────────────────────────── -->
<rect x="566" y="366" width="48" height="48" rx="10" fill="#C7166B" stroke="none" stroke-width="1.5" />
<text x="590" y="430" font-size="10" font-weight="600" fill="#1a1a2e" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >SNS Topic</text>
<text x="590" y="444" font-size="9" font-weight="normal" fill="#888888" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >findings</text>

<!-- Lambda → SNS -->
<line x1="428" y1="262" x2="562" y2="372" stroke="#555555" stroke-width="1.8"  marker-end="url(#arr)"/>

<!-- ── Notification targets ───────────────────────────────────────────── -->
<text x="590" y="468" font-size="9" font-weight="normal" fill="#888888" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >subscribe your endpoints</text>


<rect x="440" y="503" width="100" height="34" rx="6" fill="#f4f4f4" stroke="#cccccc" stroke-width="1.5" />
<text x="490" y="524" font-size="10" font-weight="normal" fill="#1a1a2e" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >PagerDuty</text>

<rect x="568" y="503" width="80" height="34" rx="6" fill="#f4f4f4" stroke="#cccccc" stroke-width="1.5" />
<text x="608" y="524" font-size="10" font-weight="normal" fill="#1a1a2e" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >Email</text>

<rect x="670" y="503" width="80" height="34" rx="6" fill="#f4f4f4" stroke="#cccccc" stroke-width="1.5" />
<text x="710" y="524" font-size="10" font-weight="normal" fill="#1a1a2e" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >SQS</text>

<!-- SNS → targets -->
<line x1="570" y1="418" x2="508" y2="504" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrd)"/>
<line x1="590" y1="418" x2="608" y2="504" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrd)"/>
<line x1="614" y1="418" x2="700" y2="504" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrd)"/>

<!-- AWS Chatbot note -->

<rect x="650" y="564" width="120" height="32" rx="6" fill="#eef4ff" stroke="#8899cc" stroke-width="1.5" />
<text x="710" y="584" font-size="9" font-weight="normal" fill="#1a1a2e" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >AWS Chatbot → Slack</text>
<line x1="710" y1="537" x2="710" y2="564" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrd)"/>

<!-- ── RivetOps Dashboard (outside account) ───────────────────────────── -->
<rect x="820" y="200" width="110" height="290" rx="10" fill="#1a1a2e" stroke="#44446a" stroke-width="1.5" />
<text x="875" y="228" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif">RivetOps</text>
<text x="875" y="244" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif">Dashboard</text>
<text x="875" y="268" font-size="9" fill="#9999cc" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif">historical view</text>
<text x="875" y="282" font-size="9" fill="#9999cc" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif">multi-account</text>
<text x="875" y="296" font-size="9" fill="#9999cc" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif">richer UI</text>
<line x1="875" y1="310" x2="875" y2="332" stroke="#44446a" stroke-width="1" stroke-dasharray="3,3"/>
<text x="875" y="356" font-size="9" fill="#6666aa" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif">optional</text>
<text x="875" y="370" font-size="9" fill="#6666aa" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif">HTTPS POST</text>
<text x="875" y="450" font-size="9" fill="#6666aa" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif">closed source</text>

<!-- Lambda - - → Dashboard -->
<line x1="428" y1="254" x2="816" y2="310" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrd)"/>
<text x="628" y="278" font-size="9" font-weight="normal" fill="#888888" text-anchor="middle" font-family="'Amazon Ember',system-ui,sans-serif" >optional</text>

<!-- ── Legend ─────────────────────────────────────────────────────────── -->
<rect x="30" y="720" width="740" height="1" fill="#cccccc"/>
<text x="50" y="748" font-size="9" fill="#888888" font-family="'Amazon Ember',system-ui,sans-serif">MIT licensed · runs entirely in your account · RivetOps never touches your infrastructure · github.com/TheAdamLabs/rivetops-agent</text>

</svg>
